name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libice-dev libsm-dev libxext-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: Restore
        run: |
          dotnet restore src/HabitTracker.Core/HabitTracker.Core.csproj
          dotnet restore src/HabitTracker.Data/HabitTracker.Data.csproj
          dotnet restore src/HabitTracker.Services/HabitTracker.Services.csproj
          dotnet restore src/HabitTracker.Desktop/HabitTracker.Desktop.csproj \
            -p:RuntimeIdentifier=linux-x64
          dotnet restore tests/HabitTracker.Core.Tests/HabitTracker.Core.Tests.csproj
          dotnet restore tests/HabitTracker.Data.Tests/HabitTracker.Data.Tests.csproj
          dotnet restore tests/HabitTracker.Services.Tests/HabitTracker.Services.Tests.csproj
          dotnet restore tests/HabitTracker.Desktop.Tests/HabitTracker.Desktop.Tests.csproj \
            -p:RuntimeIdentifier=linux-x64

      - name: Build
        run: |
          dotnet build --no-restore --configuration Release \
            src/HabitTracker.Core/HabitTracker.Core.csproj
          dotnet build --no-restore --configuration Release \
            src/HabitTracker.Data/HabitTracker.Data.csproj
          dotnet build --no-restore --configuration Release \
            src/HabitTracker.Services/HabitTracker.Services.csproj
          dotnet build --no-restore --configuration Release \
            -p:RuntimeIdentifier=linux-x64 \
            src/HabitTracker.Desktop/HabitTracker.Desktop.csproj
          dotnet build --no-restore --configuration Release \
            tests/HabitTracker.Core.Tests/HabitTracker.Core.Tests.csproj
          dotnet build --no-restore --configuration Release \
            tests/HabitTracker.Data.Tests/HabitTracker.Data.Tests.csproj
          dotnet build --no-restore --configuration Release \
            tests/HabitTracker.Services.Tests/HabitTracker.Services.Tests.csproj
          dotnet build --no-restore --configuration Release \
            -p:RuntimeIdentifier=linux-x64 \
            tests/HabitTracker.Desktop.Tests/HabitTracker.Desktop.Tests.csproj

      - name: Test Core
        run: |
          dotnet test tests/HabitTracker.Core.Tests/HabitTracker.Core.Tests.csproj \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/Core \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[HabitTracker.Core]*"

      - name: Test Data
        run: |
          dotnet test tests/HabitTracker.Data.Tests/HabitTracker.Data.Tests.csproj \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/Data \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[HabitTracker.Data]*"

      - name: Test Services
        run: |
          dotnet test tests/HabitTracker.Services.Tests/HabitTracker.Services.Tests.csproj \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/Services \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[HabitTracker.Services]*"

      - name: Test Desktop
        run: |
          dotnet test tests/HabitTracker.Desktop.Tests/HabitTracker.Desktop.Tests.csproj \
            --no-build --configuration Release \
            -p:RuntimeIdentifier=linux-x64 \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/Desktop \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[HabitTracker.Desktop]*"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/Report" \
            -reporttypes:"Html;TextSummary" \
            -classfilters:"-HabitTracker.Desktop.Views.*;-HabitTracker.Desktop.App;-HabitTracker.Desktop.Program;-HabitTracker.Desktop.Services.*;-CompiledAvaloniaXaml.*"

      - name: Print Coverage Summary
        run: cat TestResults/Report/Summary.txt

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/Report/